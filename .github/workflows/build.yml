name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout HeeremaWLED
        uses: actions/checkout@v6
        with:
          path: usermod

      - name: Checkout pinned WLED
        uses: actions/checkout@v6
        with:
          repository: wled/WLED
          ref: v16.0.1
          path: WLED
          persist-credentials: false

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-6.1.19-${{ runner.os }}-${{ hashFiles('WLED/platformio.ini', 'usermod/build/platformio_override.ini') }}
          restore-keys: |
            pio-6.1.19-${{ runner.os }}-

      - name: Install PlatformIO
        run: python3 -m pip install platformio==6.1.19

      - name: Build An-Penta-Deca firmware
        env:
          WLED_DIR: ${{ github.workspace }}/WLED
        run: ./usermod/scripts/build.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeeremaWLED-${{ github.sha }}
          path: |
            usermod/dist/*.bin
            usermod/dist/*.sha256
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          usermod/dist/*.bin usermod/dist/*.sha256
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
